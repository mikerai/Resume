<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprimir Imagen - Test Nubarium</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 2px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .output {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            word-break: break-all;
        }
        .stats {
            margin-top: 10px;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 4px;
        }
        .preview {
            max-width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Comprimir Imagen para Test Nubarium</h1>

        <div style="margin: 20px 0; padding: 15px; background: #e3f2fd; border-radius: 4px;">
            <label><strong>Max Width:</strong> <input type="number" id="maxWidth" value="3000" style="width: 100px;"> px</label><br>
            <label><strong>Max Height:</strong> <input type="number" id="maxHeight" value="4000" style="width: 100px;"> px</label><br>
            <label><strong>Quality:</strong> <input type="number" id="quality" value="0.95" step="0.01" min="0.1" max="1" style="width: 100px;"></label>
        </div>

        <input type="file" id="fileInput" accept="image/*">
        <button onclick="compressImage()">Comprimir y Generar Base64</button>
        <button onclick="copyToClipboard()">Copiar Base64</button>

        <div id="stats" class="stats" style="display: none;"></div>
        <img id="preview" class="preview" style="display: none;">
        <div id="output" class="output" style="display: none;"></div>
    </div>

    <script>
        let compressedBase64 = '';

        async function compressImage() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('Selecciona una imagen primero');
                return;
            }

            const maxWidth = parseInt(document.getElementById('maxWidth').value);
            const maxHeight = parseInt(document.getElementById('maxHeight').value);
            const quality = parseFloat(document.getElementById('quality').value);

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    // Calcular nuevas dimensiones manteniendo aspect ratio
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth || height > maxHeight) {
                        const aspectRatio = width / height;

                        // Escalar para que quepa en ambos límites
                        if (width / maxWidth > height / maxHeight) {
                            // Width es el limitante
                            width = maxWidth;
                            height = Math.round(width / aspectRatio);
                        } else {
                            // Height es el limitante
                            height = maxHeight;
                            width = Math.round(height * aspectRatio);
                        }
                    }

                    // Crear canvas
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Convertir a blob
                    canvas.toBlob((blob) => {
                        // Mostrar stats
                        const stats = document.getElementById('stats');
                        stats.style.display = 'block';
                        stats.innerHTML = `
                            <strong>Original:</strong> ${(file.size / 1024 / 1024).toFixed(2)} MB (${img.width}x${img.height})<br>
                            <strong>Comprimida:</strong> ${(blob.size / 1024 / 1024).toFixed(2)} MB (${width}x${height})<br>
                            <strong>Reducción:</strong> ${(((file.size - blob.size) / file.size) * 100).toFixed(1)}%
                        `;

                        // Mostrar preview
                        const preview = document.getElementById('preview');
                        preview.style.display = 'block';
                        preview.src = canvas.toDataURL('image/jpeg', quality);

                        // Convertir a base64
                        const reader2 = new FileReader();
                        reader2.onload = () => {
                            // Extraer solo el base64 (sin el prefijo)
                            compressedBase64 = reader2.result.split(',')[1];

                            const output = document.getElementById('output');
                            output.style.display = 'block';
                            output.innerHTML = `
                                <strong>Base64 (primeros 200 chars):</strong><br>
                                ${compressedBase64.substring(0, 200)}...<br><br>
                                <strong>Longitud total:</strong> ${compressedBase64.length} caracteres<br>
                                <strong>Tamaño en bytes:</strong> ${(compressedBase64.length * 3/4).toFixed(0)} bytes
                            `;
                        };
                        reader2.readAsDataURL(blob);
                    }, 'image/jpeg', quality);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function copyToClipboard() {
            if (!compressedBase64) {
                alert('Comprime una imagen primero');
                return;
            }

            navigator.clipboard.writeText(compressedBase64).then(() => {
                alert('Base64 copiado al clipboard!');
            }).catch(err => {
                // Fallback para navegadores sin clipboard API
                const textarea = document.createElement('textarea');
                textarea.value = compressedBase64;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Base64 copiado al clipboard!');
            });
        }
    </script>
</body>
</html>
