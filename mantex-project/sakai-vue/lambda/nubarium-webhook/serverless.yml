service: nubarium-webhook

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  memorySize: 128
  timeout: 30
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_SERVICE_KEY: ${env:SUPABASE_SERVICE_KEY}

functions:
  webhook:
    handler: index.handler
    events:
      - http:
          path: /webhook/sat
          method: post
          cors: true
      - http:
          path: /webhook/sat
          method: options
          cors: true

# CloudFormation para crear la URL limpia
resources:
  Outputs:
    WebhookUrl:
      Description: "Webhook URL para Nubarium"
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:provider.region}
            - ".amazonaws.com/"
            - ${self:provider.stage}
            - "/webhook/sat"

plugins:
  - serverless-offline