service: mantex-lambdas

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'prod'}
  region: us-east-1
  memorySize: 256
  timeout: 30
  environment:
    AWS_S3_BUCKET: mantex-documents-1763361307
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::mantex-documents-1763361307/*
            - arn:aws:s3:::mantex-documents-1763361307

functions:
  # S3 Operations
  s3Upload:
    handler: s3-upload-lambda.handler
    events:
      - http:
          path: /s3/upload
          method: post
          cors: true
      - http:
          path: /s3/upload
          method: options
          cors: true
    description: Upload files to S3 with proper structure

  s3Delete:
    handler: s3-delete-lambda.handler
    events:
      - http:
          path: /s3/delete
          method: post
          cors: true
      - http:
          path: /s3/delete
          method: options
          cors: true
    description: Delete files from S3

  s3List:
    handler: s3-list-lambda.handler
    events:
      - http:
          path: /s3/list
          method: post
          cors: true
      - http:
          path: /s3/list
          method: options
          cors: true
    description: List files from S3 by user and type

  # Nubarium API Proxy
  nubariumProxy:
    handler: nubarium-proxy-lambda.handler
    timeout: 60
    events:
      - http:
          path: /nubarium/{proxy+}
          method: any
          cors: true
    description: Proxy for all Nubarium API endpoints (ocr, sat, ine, biometrics)

resources:
  Outputs:
    S3UploadUrl:
      Description: "S3 Upload Lambda URL"
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:provider.region}
            - ".amazonaws.com/"
            - ${self:provider.stage}
            - "/s3/upload"
    S3DeleteUrl:
      Description: "S3 Delete Lambda URL"
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:provider.region}
            - ".amazonaws.com/"
            - ${self:provider.stage}
            - "/s3/delete"
    S3ListUrl:
      Description: "S3 List Lambda URL"
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:provider.region}
            - ".amazonaws.com/"
            - ${self:provider.stage}
            - "/s3/list"
    NubariumProxyUrl:
      Description: "Nubarium Proxy Lambda Base URL"
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:provider.region}
            - ".amazonaws.com/"
            - ${self:provider.stage}
            - "/nubarium"

plugins:
  - serverless-offline
